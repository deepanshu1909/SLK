<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Brand | Official Landing Page</title>
  <meta name="description" content="Follow @kolorstudionyc on Instagram for the latest updates.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  
  <link rel="canonical" href="https://www.kolorstudionyc.com/">
  

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Brand | Official Landing Page">
  <meta property="og:description" content="Follow @kolorstudionyc on Instagram for the latest updates.">
  
  
  <meta property="og:url" content="https://www.kolorstudionyc.com/">
  

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Brand | Official Landing Page">
  <meta name="twitter:description" content="Follow @kolorstudionyc on Instagram for the latest updates.">
  

  <!-- JSON-LD Structured Data (Google recommended) -->
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Your Brand",
  "description": "Follow @kolorstudionyc on Instagram for the latest updates.",
  "url": "https://www.kolorstudionyc.com/",
  "sameAs": [
    "https://www.instagram.com/kolorstudionyc/",
    "https://www.kolorstudionyc.com/"
  ]
}
  </script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #7c3aed;
      --bg: #f8fafc;
      --text: #111827;
      --text-muted: #6b7280;
      --surface: #ffffff;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 1rem;
    }

    img { max-width: 100%; height: auto; display: block; }

    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      width: min(1120px, 92vw);
      margin-inline: auto;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff !important;
      padding: 0.625rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none !important;
      transition: background 0.2s;
    }

    .nav-cta:hover { background: var(--primary-dark); }

    /* Hero */
    .hero {
      padding: 4rem 0 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; padding: 2.5rem 0 2rem; }
    }

    .hero-badge {
      display: inline-block;
      background: color-mix(in srgb, var(--primary) 15%, transparent);
      color: var(--primary-dark);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .hero-desc {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      max-width: 52ch;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff !important;
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      text-decoration: none !important;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      color: var(--text) !important;
      border: 2px solid color-mix(in srgb, var(--text) 15%, transparent);
      padding: 0.8125rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      text-decoration: none !important;
      transition: border-color 0.2s;
    }

    .btn-secondary:hover { border-color: var(--primary); }

    .hero-image {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      aspect-ratio: 4/3;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sections */
    section { padding: 4rem 0; }

    section:nth-child(even) { background: var(--surface); }

    .section-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .section-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 65ch;
      margin-bottom: 2rem;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; }
    }

    .about-text p + p { margin-top: 1rem; }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .gallery-item {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      aspect-ratio: 1;
      background: color-mix(in srgb, var(--text) 5%, transparent);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-item:hover img { transform: scale(1.04); }

    /* Features / highlights */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .feature-card {
      background: var(--bg);
      border: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    section:nth-child(even) .feature-card { background: var(--surface); }

    .feature-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .feature-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* CTA band */
    .cta-band {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      text-align: center;
      padding: 4rem 2rem;
      border-radius: var(--radius);
      margin: 2rem 0;
    }

    .cta-band h2 {
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      margin-bottom: 0.75rem;
    }

    .cta-band p {
      opacity: 0.9;
      margin-bottom: 1.5rem;
      max-width: 50ch;
      margin-inline: auto;
    }

    .cta-band .btn-primary {
      background: #fff;
      color: var(--primary-dark) !important;
    }

    .cta-band .btn-primary:hover { background: color-mix(in srgb, #fff 90%, var(--primary)); }

    /* Footer */
    footer {
      background: var(--text);
      color: color-mix(in srgb, #fff 75%, transparent);
      padding: 2.5rem 0;
      font-size: 0.9rem;
    }

    footer a { color: #fff; }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .social-links {
      display: flex;
      gap: 1.25rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="#" class="logo">
        
        <span>Your Brand</span>
      </a>
      
      <a href="https://www.kolorstudionyc.com/" class="nav-cta" target="_blank" rel="noopener noreferrer">
        Visit Website
      </a>
      
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero" aria-labelledby="hero-heading">
        <div>
          
          <h1 id="hero-heading">Your Brand</h1>
          <p class="hero-desc">Follow @kolorstudionyc on Instagram for the latest updates.</p>
          <div class="hero-actions">
            
            <a href="https://www.kolorstudionyc.com/" class="btn-primary" target="_blank" rel="noopener noreferrer">
              Visit Website
            </a>
            
            
            <a href="https://www.instagram.com/kolorstudionyc/" class="btn-secondary" target="_blank" rel="noopener noreferrer">
              Follow on Instagram
            </a>
            
          </div>
        </div>
        
      </section>
    </div>

    

    

    

    <div class="container">
      <aside class="cta-band" aria-label="Call to action">
        <h2>Connect With Your Brand</h2>
        <p>Follow @kolorstudionyc on Instagram for the latest updates.</p>
        
        <a href="https://www.kolorstudionyc.com/" class="btn-primary" target="_blank" rel="noopener noreferrer">
          Visit Website
        </a>
        
      </aside>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <p>&copy; 2026 Your Brand. All rights reserved.</p>
      <nav class="social-links" aria-label="Social links">
        
        <a href="https://www.kolorstudionyc.com/" target="_blank" rel="noopener noreferrer">Website</a>
        
        
        <a href="https://www.instagram.com/kolorstudionyc/" target="_blank" rel="noopener noreferrer">Instagram</a>
        
      </nav>
    </div>
  </footer>
</body>
</html>
